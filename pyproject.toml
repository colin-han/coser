[build-system]
requires = ["setuptools>=58.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coser"
version = "0.5.1"
description = "Claude Code account switching CLI"
requires-python = ">=3.9"
dependencies = [
    "tomli>=1.2.0; python_version < '3.11'",
]

[project.scripts]
coser = "coser.cli:main"
